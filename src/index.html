<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-Agent AI Academic Assistant</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      background: #111111;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .header-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #4e89ae, #2d6a4f);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .header-text h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .header-text span {
      font-size: 0.72rem;
      color: #555;
      font-weight: 400;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      color: #4caf82;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4caf82;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(76,175,130,0.4); }
      50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(76,175,130,0); }
    }

    /* ── CHAT AREA ── */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    /* ── WELCOME ── */
    #welcome {
      margin: auto;
      text-align: center;
      padding: 40px 20px;
    }

    .welcome-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    #welcome h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    #welcome p {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .suggestion-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #aaa;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .suggestion-btn:hover {
      background: #222;
      border-color: #4e89ae;
      color: #fff;
    }

    /* ── MESSAGES ── */
    .message-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .avatar.ai-avatar {
      background: linear-gradient(135deg, #4e89ae, #2d6a4f);
    }

    .avatar.user-avatar {
      background: #2a2a2a;
      border: 1px solid #333;
    }

    .bubble {
      max-width: 75%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .bubble.user {
      background: #1e3a4f;
      color: #e8f4fd;
      border-top-right-radius: 4px;
      border: 1px solid #2a5070;
    }

    .bubble.ai {
      background: #161616;
      color: #e0e0e0;
      border-top-left-radius: 4px;
      border: 1px solid #222;
    }

    /* ── AI CONTENT FORMATTING ── */
    .bubble.ai strong { color: #ffffff; font-weight: 600; }

    .bubble.ai ul {
      padding-left: 18px;
      margin: 8px 0;
    }

    .bubble.ai ul li {
      margin: 5px 0;
      color: #ccc;
      list-style: disc;
    }

    .bubble.ai ol {
      padding-left: 18px;
      margin: 8px 0;
    }

    .bubble.ai ol li { margin: 5px 0; color: #ccc; }

    .bubble.ai p { margin: 6px 0; }

    .bubble.ai h3 {
      color: #4e89ae;
      font-size: 0.95rem;
      margin: 12px 0 6px;
    }

    .bubble.ai code {
      background: #1e1e1e;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #82cfff;
      font-family: monospace;
    }

    /* ── STAR RATING ── */
    .feedback-row {
      display: flex;
      gap: 4px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #222;
    }

    .star {
      cursor: pointer;
      font-size: 1rem;
      color: #333;
      transition: color 0.15s, transform 0.15s;
    }

    .star:hover { transform: scale(1.2); }
    .star.active { color: #f0a500; }

    .feedback-label {
      font-size: 0.72rem;
      color: #555;
      margin-left: 6px;
      align-self: center;
    }

    /* ── LOADING ── */
    .loading-row {
      display: flex;
      gap: 12px;
      align-items: center;
      animation: fadeUp 0.3s ease;
    }

    .loading-bubble {
      background: #161616;
      border: 1px solid #222;
      border-radius: 18px;
      border-top-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #4e89ae;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50%       { transform: translateY(-5px); opacity: 1; }
    }

    /* ── INPUT AREA ── */
    #input-area {
      padding: 16px 20%;
      background: #0d0d0d;
      border-top: 1px solid #1a1a1a;
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within { border-color: #4e89ae; }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 0.92rem;
      resize: none;
      outline: none;
      min-height: 24px;
      max-height: 120px;
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
    }

    #user-input::placeholder { color: #444; }

    #send-btn {
      background: #4e89ae;
      color: white;
      border: none;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #send-btn:hover { background: #3a6d8c; transform: scale(1.05); }
    #send-btn:disabled { background: #222; cursor: not-allowed; transform: none; }

    .input-hint {
      font-size: 0.7rem;
      color: #333;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-icon">🎓</div>
  <div class="header-text">
    <h1>Academic AI Assistant</h1>
    <span>Multi-Agent System for Academic Help</span>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    Online
  </div>
</header>

<!-- CHAT BOX -->
<div id="chat-box">
  <div id="welcome">
    <div class="welcome-icon">🎓</div>
    <h2>How can I help you today?</h2>
    <p>Ask me anything about your studies, essays, research, or academic topics.</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="suggest('How do I write a thesis statement?')">✍️ How do I write a thesis statement?</button>
      <button class="suggestion-btn" onclick="suggest('Explain the water cycle')">🌍 Explain the water cycle</button>
      <button class="suggestion-btn" onclick="suggest('Give me study tips for exams')">📚 Study tips for exams</button>
      <button class="suggestion-btn" onclick="suggest('What is machine learning?')">🤖 What is machine learning?</button>
    </div>
  </div>
</div>

<!-- INPUT AREA -->
<div id="input-area">
  <div class="input-wrapper">
    <textarea
      id="user-input"
      placeholder="Ask a question..."
      rows="1"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Send">➤</button>
  </div>
  <p class="input-hint">Press Enter to send · Shift+Enter for new line</p>
</div>

<script>
  const chatBox    = document.getElementById('chat-box');
  const inputField = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const USER_ID    = '123';

  inputField.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  inputField.addEventListener('input', () => {
    inputField.style.height = 'auto';
    inputField.style.height = inputField.scrollHeight + 'px';
  });

  function suggest(text) {
    inputField.value = text;
    sendMessage();
  }

  function removeWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function formatText(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`(.*?)`/g, '<code>$1</code>')
      .replace(/^### (.*)/gm, '<h3>$1</h3>')
      .replace(/^## (.*)/gm, '<h3>$1</h3>')
      .replace(/^\s*[\*\-]\s+(.+)/gm, '<li>$1</li>')
      .replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>')
      .replace(/<\/ul>\s*<ul>/g, '')
      .replace(/^\d+\.\s+(.+)/gm, '<li>$1</li>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
  }

  function appendMessage(role, text) {
    removeWelcome();

    const row = document.createElement('div');
    row.className = `message-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}-avatar`;
    avatar.textContent = role === 'ai' ? '🤖' : '👤';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;

    if (role === 'ai') {
      bubble.innerHTML = `<p>${formatText(text)}</p>`;

      // Star rating
      const feedbackRow = document.createElement('div');
      feedbackRow.className = 'feedback-row';
      const label = document.createElement('span');
      label.className = 'feedback-label';
      label.textContent = 'Rate this response:';
      feedbackRow.appendChild(label);

      for (let i = 1; i <= 5; i++) {
        const s = document.createElement('span');
        s.className = 'star';
        s.textContent = '★';
        s.dataset.rating = i;
        s.onclick = () => sendFeedback(i, feedbackRow);
        feedbackRow.appendChild(s);
      }
      bubble.appendChild(feedbackRow);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showLoading() {
    removeWelcome();
    const row = document.createElement('div');
    row.className = 'loading-row';
    row.id = 'loading-indicator';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai-avatar';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'loading-bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function hideLoading() {
    const l = document.getElementById('loading-indicator');
    if (l) l.remove();
  }

  async function sendMessage() {
    const message = inputField.value.trim();
    if (!message) return;

    appendMessage('user', message);
    inputField.value = '';
    inputField.style.height = 'auto';
    sendBtn.disabled = true;
    showLoading();

    try {
      const res = await fetch('http://localhost:5000/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID, message })
      });

      const data = await res.json();
      hideLoading();

      if (data.status === 'success') {
        appendMessage('ai', data.response);
      } else {
        appendMessage('ai', '⚠️ Error: ' + data.message);
      }
    } catch (err) {
      hideLoading();
      appendMessage('ai', '⚠️ Could not connect to server. Make sure Flask is running.');
    }

    sendBtn.disabled = false;
    inputField.focus();
  }

  async function sendFeedback(rating, starsDiv) {
    const stars = starsDiv.querySelectorAll('.star');
    stars.forEach((s, i) => s.classList.toggle('active', i < rating));

    const label = starsDiv.querySelector('.feedback-label');
    if (label) label.textContent = `Thanks for rating ${rating}/5!`;

    try {
      await fetch('http://localhost:5000/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID, rating, comment: 'Rated from UI' })
      });
    } catch (err) {
      console.log('Feedback error:', err);
    }
  }
</script>
</body>
</html>
